name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Deploy ────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /root/6mixx-bot-discord
            git pull origin main
            docker compose --profile prod build --no-cache bot migrate
            echo "🔄 Starting infrastructure services..."
            docker compose up -d postgres redis
            echo "⏳ Waiting for postgres and redis to be healthy..."
            timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" 6mixx-postgres 2>/dev/null | grep -q healthy; do sleep 2; done'
            timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" 6mixx-redis 2>/dev/null | grep -q healthy; do sleep 2; done'
            echo "✅ Infrastructure healthy"
            echo "🔄 Running database migrations..."
            docker compose --profile prod run --rm migrate
            echo "✅ Migrations complete"
            docker compose --profile prod up -d bot
            docker image prune -f
            echo "✅ Deployed at $(date)"

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sleep 10
            cd /root/6mixx-bot-discord
            if docker compose --profile prod ps bot | grep -q "Up"; then
              echo "✅ Bot is running"
            else
              echo "❌ Bot failed to start"
              docker compose --profile prod logs bot --tail 50
              exit 1
            fi
